[project]
name = "moonbridge"
version = "0.3.0"
description = "Call Kimi Code from Claude Code or Codex for delegation, review, and second opinions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Brian Connelly" },
]
keywords = ["moonbridge", "kimi", "claude-code", "codex", "code-review", "delegation", "mcp", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "anyio>=4",
    "pontonier==0.7.0",
    "fastmcp>=4,<5",
    "pydantic>=2.12",
]

[project.urls]
Homepage = "https://github.com/briandconnelly/moonbridge"
Repository = "https://github.com/briandconnelly/moonbridge"
Issues = "https://github.com/briandconnelly/moonbridge/issues"
Changelog = "https://github.com/briandconnelly/moonbridge/blob/main/CHANGELOG.md"
Security = "https://github.com/briandconnelly/moonbridge/blob/main/SECURITY.md"

[project.scripts]
moonbridge-mcp = "moonbridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moonbridge"]

[dependency-groups]
dev = [
    "prek>=0.5.0",
    # Used directly by tests/test_schemas.py to validate published JSON Schemas.
    # Reaches the environment transitively via fastmcp today; declared explicitly so
    # the tests do not break if that dependency tree changes.
    "jsonschema>=4.26",
    "pyyaml>=6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.ruff]
line-length = 100
# Matches requires-python (>=3.11).
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PIE", "RUF", "PL", "PT", "TID", "TC", "ARG", "PTH"]
ignore = [
    "PLR0913",  # too-many-args: tool handlers legitimately take many params
    "PLR0917",  # too-many-positional-args: same handlers — MCP params arrive by name
    "PLR0911",  # too-many-returns: dispatch/classify handlers branch per error case
    "PLR0912",  # too-many-branches: same — error-path-heavy handlers
    "PLR2004",  # magic-value: noisy for literals
]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts, fixtures-as-args, private access, inline literals, broad
# raises, and comma-string parametrize names by design.
"tests/**" = ["ARG", "PLR2004", "S101", "TC001", "TC002", "TC003", "PT006", "PT011", "PT018", "PLC0415", "RUF059", "SLF001"]

[tool.ty.src]
# Type-check shipped code; tests use dynamic/Optional-subscript patterns by design.
include = ["src"]

[tool.ty.rules]
# fastmcp/anyio expose runtime shapes ty can't fully resolve; don't fail on third-party imports.
unresolved-import = "warn"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=moonbridge --cov-report=term-missing --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: live tests requiring the kimi CLI; opt in with `pytest -m integration --no-cov`",
]
# ADR 0005 / FastMCP 4 upgrade checklist step 12. MCP SDK v2 renamed every protocol model
# field to snake_case and FastMCP bridges the old camelCase spellings with a warning. The
# bridge is scheduled for removal, so a surviving camelCase read is a future hard failure
# that otherwise passes CI silently today. Promoting the warning to an error surfaces each
# one now, and covers the rest of FastMCP's deprecations on the same principle.
filterwarnings = [
    "error::fastmcp._warnings.FastMCPDeprecationWarning",
]

[tool.coverage.run]
source = ["src/moonbridge"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
